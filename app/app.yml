version: 2

name: TEAM_A_PURCHASE_QUIZ
database: TEAM_A_DB
schema: DEVELOPMENT
query_warehouse: TEAM_A_WH

label: "購買層クイズ"
description: "カテゴリ購入者数TOP5から購買集団の属性を当てるクイズ"
icon: "public/icon.svg"
auto_suspend_secs: 300

install:
  commands:
    - ["npm", "ci", "--include=dev"]

build:
  commands:
    - ["npm", "run", "build"]
    # For standalone mode
    - ["cp", "-r", ".next/static", ".next/standalone/.next/static"]
    - ["cp", "-r", "public", ".next/standalone/public"]
    # Avoid packaging extra node_modules since standalone includes its own
    - ["rm", "-rf", "node_modules"]

run:
  command: ["node", ".next/standalone/server.js"]

ignore:
  - node_modules
  - .env*
  - __pycache__
  - "*.pyc"
  - .next
  - .git
  - snowflake.log
